    <button class="btn" data-act="practice" data-topic="weak" ${weak?"":"disabled"}>Weak spots${weak?` (${weak})`:""}</button>
  </div>
  <div class="topics">${topicListHTML()}</div>`;
}
function pickPractice(topic, n=10){
  let pool = topic==="all" ? Q : topic==="weak" ? Q.filter(q=>isWeak(q.id)) : Q.filter(q=>q.t===topic);
  const prio = q => { const r = st.stats[q.id]; if (!r) return 1; if (r.last===0) return 0; return 2 + r.c/r.n; };
  return pool.map(q=>({q, k:prio(q)+Math.random()*0.9})).sort((a,b)=>a.k-b.k).slice(0,n).map(x=>x.q);
}
function startPractice(topic){
  const qs = shuffle(pickPractice(topic));
  if (!qs.length) return;
  session = { mode:"practice", topic, items: qs.map(prepare), i:0, right:0 };
  stopTick(); showTabs(true); renderPractice();
}
function renderPractice(){
  const s = session, it = s.items[s.i], done = it.pick !== null;
  const label = s.topic==="all" ? "Mixed set" : s.topic==="weak" ? "Weak spots" : TOPICS[s.topic].name;
  main().innerHTML = `
  <div class="runner">
    <div class="run-top"><button class="link" data-act="go" data-view="practice">← ${esc(label)}</button><span class="count">${s.i+1} / ${s.items.length}</span></div>
    <div class="progress"><i style="width:${pct(s.i+(done?1:0), s.items.length)}%"></i></div>
    ${questionHTML(it, done, "pr")}
    ${done?`<div class="explain ${it.opts[it.pick].ok?"ok":"no"}" role="status"><strong>${it.opts[it.pick].ok?"Correct.":"Not quite."}</strong> ${esc(it.q.e)}</div>
    <button class="btn primary wide" data-act="pr-next" id="nextBtn">${s.i+1<s.items.length?"Next question":"See results"}</button>`:""}
  </div>`;
  if (done) $("#nextBtn")?.focus();
}
function questionHTML(it, reveal, act){
  return `<div class="qcard">
    <div class="topic-tag">${TOPICS[it.q.t].name}</div>
    ${it.q.s?`<div class="sign">${signSVG(it.q.s)}</div>`:""}
    <p class="q-text lg">${esc(it.q.q)}</p>
    <div class="answers">${it.opts.map((o,i)=>{
      let c = "";
      if (reveal) c = o.ok ? "right" : (it.pick===i ? "wrong" : "dim");
      else if (it.pick===i) c = "chosen";
      return `<button class="ans ${c}" data-act="${act}" data-i="${i}" ${reveal?"disabled":""} aria-pressed="${it.pick===i}"><span class="key">${"ABCD"[i]}</span><span>${esc(o.text)}</span></button>`;
    }).join("")}</div>
  </div>`;
}
function practiceSummary(){
  const s = session, n = s.items.length;
  main().innerHTML = `
  <div class="runner">
    <div class="result card">
      <div class="label">${s.topic==="all"?"Mixed set":s.topic==="weak"?"Weak spots":TOPICS[s.topic].name}</div>
      <div class="big">${s.right}<span>/${n}</span></div>
      <p class="fine">${s.right===n?"Perfect set.":s.right/n>=0.8?"Above the 80% pass line.":"Below the 80% pass line. Missed questions are saved to Weak spots."}</p>
      <div class="actions">
        <button class="btn primary" data-act="practice" data-topic="${s.topic==="weak"&&!weakIds().length?"all":s.topic}">Another set</button>
        <button class="btn" data-act="go" data-view="practice">All topics</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Mock exam ---------- */
function pickExam(){
  const out = [], groups = {};
  Q.forEach(q => (groups[q.t] = groups[q.t] || []).push(q));
  const keys = Object.keys(groups);
  keys.forEach(k => { const take = Math.floor(EXAM_N * groups[k].length / Q.length); out.push(...shuffle(groups[k]).slice(0, take)); });
  const rest = shuffle(Q.filter(q => !out.includes(q)));
  while (out.length < EXAM_N && rest.length) out.push(rest.pop());
  return shuffle(out);
}
function examIntro(){
  showTabs(true); setTab("home");
  main().innerHTML = `
  <div class="runner">
    <header class="page-h"><h1>Mock exam</h1><p>40 questions drawn from every topic, like the DVS test. You see results and explanations at the end.</p></header>
    <div class="card spec">
      <dl>
        <div><dt>Questions</dt><dd>40</dd></div>
        <div><dt>To pass</dt><dd>32 correct</dd></div>
        <div><dt>Time</dt><dd>${st.settings.timer?EXAM_MIN+" min":"Untimed"}</dd></div>
      </dl>
      <label class="toggle"><input type="checkbox" id="timerToggle" ${st.settings.timer?"checked":""}><span>Use a ${EXAM_MIN}-minute time limit</span></label>
      <p class="fine">The real Minnesota test has no time limit. A timer helps you practice working at a steady pace.</p>
      <button class="btn primary wide" data-act="exam-go">Begin exam</button>
    </div>
  </div>`;
}
function startExam(){
  session = { mode:"exam", items: pickExam().map(prepare), i:0, t0: Date.now(), limit: st.settings.timer ? EXAM_MIN*60000 : 0, confirm:false };
  showTabs(false); renderExam();
  stopTick();
  tick = setInterval(()=>{
    if (!session || session.mode!=="exam") return stopTick();
    const el = $("#clock"); const used = Date.now()-session.t0;
    if (session.limit) { const left = session.limit-used; if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 5*60000); } if (left <= 0) finishExam(true); }
    else if (el) el.textContent = fmtTime(used);
  }, 500);
}
function renderExam(){
  const s = session, it = s.items[s.i], answered = s.items.filter(x=>x.pick!==null).length;
  const used = Date.now()-s.t0;
  main().innerHTML = `
  <div class="runner exam">
    <div class="run-top">
      <button class="link" data-act="exam-quit">Quit</button>
      <span class="count">Question ${s.i+1} of ${EXAM_N}</span>
      <span class="clock" id="clock" aria-label="${s.limit?"Time left":"Time used"}">${fmtTime(s.limit? s.limit-used : used)}</span>
    </div>
    <div class="progress"><i style="width:${pct(answered,EXAM_N)}%"></i></div>
    ${s.confirm==="quit"?`<div class="confirm card"><p>Quit this exam? Your answers will not be saved.</p><div class="actions"><button class="btn danger" data-act="exam-quit-yes">Quit exam</button><button class="btn" data-act="confirm-no">Keep going</button></div></div>`:""}
    ${questionHTML(it, false, "ex")}
    <div class="exam-nav">
      <button class="btn" data-act="ex-prev" ${s.i===0?"disabled":""}>Back</button>
      ${s.i+1<EXAM_N?`<button class="btn primary" data-act="ex-next" ${it.pick===null?"":""}>Next</button>`:`<button class="btn primary" data-act="ex-submit">Submit</button>`}
    </div>
    <div class="grid" aria-label="Jump to question">${s.items.map((x,i)=>`<button class="dot ${x.pick!==null?"done":""} ${i===s.i?"here":""}" data-act="ex-jump" data-i="${i}" aria-label="Question ${i+1}${x.pick!==null?", answered":""}">${i+1}</button>`).join("")}</div>
    ${s.confirm==="submit"?`<div class="confirm card"><p>${EXAM_N-answered} question${EXAM_N-answered===1?" is":"s are"} unanswered and will count as wrong. Submit anyway?</p><div class="actions"><button class="btn primary" data-act="ex-submit-yes">Submit exam</button><button class="btn" data-act="confirm-no">Keep working</button></div></div>`:""}
  </div>`;
}
function finishExam(timedOut){
  const s = session; stopTick();
  let score = 0; const byTopic = {};
  s.items.forEach(it => { const ok = it.pick!==null && it.opts[it.pick].ok; if (ok) score++; record(it.q.id, ok);
    const b = byTopic[it.q.t] || (byTopic[it.q.t] = {n:0,c:0}); b.n++; if (ok) b.c++; });
  const ms = Date.now()-s.t0;
  st.exams.push({ d: Date.now(), score, ms, timed: !!s.limit });
  st.exams = st.exams.slice(-50); save();
  const missed = s.items.filter(it => !(it.pick!==null && it.opts[it.pick].ok));
  session = null; showTabs(true); setTab("home");
  const passed = score >= PASS;
  main().innerHTML = `
  <div class="runner">
    <div class="result card ${passed?"pass":"fail"}">
      <div class="stamp">${passed?"PASS":"NOT YET"}</div>
      <div class="big">${score}<span>/40</span></div>
      <p class="fine">${timedOut?"Time ran out. ":""}${passed?`You cleared the 32-question pass line${score-PASS?` by ${score-PASS}`:""}.`:`You needed ${PASS-score} more correct to pass.`} Time used ${fmtTime(ms)}.</p>
      <div class="breakdown">${Object.entries(byTopic).map(([k,b])=>`<div class="bd-row"><span>${TOPICS[k].name}</span><span class="num">${b.c}/${b.n}</span><div class="bar"><i class="${b.c/b.n<0.8?"low":""}" style="width:${pct(b.c,b.n)}%"></i></div></div>`).join("")}</div>
      <div class="actions"><button class="btn primary" data-act="exam-start">New exam</button>${missed.length?`<button class="btn" data-act="practice" data-topic="weak">Practice missed</button>`:""}</div>
    </div>
    ${missed.length?`<h2 class="section-h">Review missed questions (${missed.length})</h2>
    <div class="review">${missed.map(it=>`<div class="rv card">
      <div class="topic-tag">${TOPICS[it.q.t].name}</div>
      <div class="q-row">${it.q.s?`<div class="sign sm">${signSVG(it.q.s)}</div>`:""}<p class="q-text">${esc(it.q.q)}</p></div>
      ${it.pick!==null?`<p class="rv-line no"><b>Your answer</b> ${esc(it.opts[it.pick].text)}</p>`:`<p class="rv-line no"><b>Your answer</b> Not answered</p>`}
      <p class="rv-line ok"><b>Correct</b> ${esc(it.q.a[0])}</p>
      <p class="fine">${esc(it.q.e)}</p></div>`).join("")}</div>`:""}
  </div>`;
  main().scrollTop = 0;
}

/* ---------- Sign flashcards ---------- */
let deck = null;
function viewSigns(arg){
  setTab("signs");
  const box = s => st.cards[s] || 0;
  const learned = CARDS.filter(c => box(c.s) >= 2).length;
  if (!deck || arg === "reset") {
    deck = { order: shuffle(CARDS).sort((a,b)=>box(a.s)-box(b.s)), i:0, flip:false };
  }
  const c = deck.order[deck.i];
  main().innerHTML = `
  <header class="page-h"><h1>Road signs</h1><p>Name the sign, then flip to check. Signs you know move to the back of the deck.</p></header>
  <div class="deck-stats"><span><b class="num">${learned}</b> of ${CARDS.length} learned</span><div class="bar"><i style="width:${pct(learned,CARDS.length)}%"></i></div></div>
  <div class="flash card ${deck.flip?"flipped":""}">
    <div class="count">${deck.i+1} / ${deck.order.length}</div>
    <div class="sign xl">${signSVG(c.s)}</div>
    ${deck.flip?`<div class="flash-back"><h2>${esc(c.n)}</h2><p>${esc(c.m)}</p></div>
      <div class="actions two"><button class="btn" data-act="card-again">Study again</button><button class="btn primary" data-act="card-got">I knew it</button></div>`
    :`<p class="fine center">What does this sign mean?</p><button class="btn primary wide" data-act="card-flip" id="flipBtn">Show answer</button>`}
  </div>
  <div class="legend card">
    <h2 class="section-h tight">Shapes and colors</h2>
    <dl class="legend-grid">
      <div><dt>Octagon</dt><dd>Stop</dd></div><div><dt>Triangle, point down</dt><dd>Yield</dd></div>
      <div><dt>Pentagon</dt><dd>School zone</dd></div><div><dt>Circle</dt><dd>Railroad ahead</dd></div>
      <div><dt>Pennant</dt><dd>No passing zone</dd></div><div><dt>Diamond</dt><dd>Warning</dd></div>
      <div><dt><i class="sw" style="background:#f47b20"></i>Orange</dt><dd>Work zone</dd></div><div><dt><i class="sw" style="background:#00754a"></i>Green</dt><dd>Directions</dd></div>
      <div><dt><i class="sw" style="background:#1f4fa3"></i>Blue</dt><dd>Services</dd></div><div><dt><i class="sw" style="background:#7a4a24"></i>Brown</dt><dd>Recreation</dd></div>
    </dl>
  </div>`;
}
function cardNext(knew){
  const c = deck.order[deck.i];
  st.cards[c.s] = knew ? Math.min(3, (st.cards[c.s]||0)+1) : 0; save();
  if (!knew) deck.order.push(c);
  deck.i++; deck.flip = false;
  if (deck.i >= deck.order.length) deck = null;
  viewSigns();
}

/* ---------- Progress ---------- */
function viewProgress(){
  setTab("progress");
  const ex = st.exams, best = ex.length ? Math.max(...ex.map(e=>e.score)) : null;
  const passes = ex.filter(e=>e.score>=PASS).length;
  const seen = Object.keys(st.stats).filter(id=>byId[id]).length;
  const m = Q.filter(q=>mastered(q.id)).length;
  const learned = CARDS.filter(c => (st.cards[c.s]||0) >= 2).length;
  main().innerHTML = `
  <header class="page-h"><h1>Progress</h1><p>Saved on this device.</p></header>
  <div class="stats">
    <div class="stat"><div class="label">Mock exams</div><div class="num big-n">${ex.length}</div><div class="fine">${passes} passed</div></div>
    <div class="stat"><div class="label">Best score</div><div class="num big-n">${best===null?"—":best}</div><div class="fine">out of 40</div></div>
    <div class="stat"><div class="label">Mastered</div><div class="num big-n">${m}</div><div class="fine">of ${Q.length} questions</div></div>
    <div class="stat"><div class="label">Signs learned</div><div class="num big-n">${learned}</div><div class="fine">of ${CARDS.length}</div></div>
  </div>
  <section class="card">
    <h2 class="section-h tight">Mock exam scores</h2>
    ${ex.length ? chartSVG(ex.slice(-12)) : `<div class="empty"><p>No exams yet. Your scores will chart here against the 32-question pass line.</p><button class="btn primary" data-act="exam-start">Take your first mock exam</button></div>`}
  </section>
  <section class="card">
    <h2 class="section-h tight">Accuracy by topic</h2>
    <div class="breakdown">${Object.entries(TOPICS).map(([k,t])=>{const s=topicStats(k);return `<div class="bd-row"><span>${t.name}</span><span class="num">${s.acc===null?"—":s.acc+"%"}</span><div class="bar"><i class="${s.acc!==null&&s.acc<80?"low":""}" style="width:${s.acc||0}%"></i></div></div>`;}).join("")}</div>
    <p class="fine">${seen} of ${Q.length} questions attempted. Topics under 80% are marked.</p>
  </section>
  <section class="card reset">
    <div id="resetZone"><button class="btn ghost" data-act="reset">Reset all progress</button></div>
  </section>`;
}
function chartSVG(ex){
  const W=320,H=170,L=30,R=12,T=14,B=26, iw=W-L-R, ih=H-T-B;
  const x = i => L + (ex.length===1 ? iw/2 : i*iw/(ex.length-1));
  const y = v => T + ih - (v/40)*ih;
  const pts = ex.map((e,i)=>`${x(i).toFixed(1)},${y(e.score).toFixed(1)}`);
  const area = `M${x(0).toFixed(1)},${y(0)} L${pts.join(" L")} L${x(ex.length-1).toFixed(1)},${y(0)} Z`;
  const ticks = [0,10,20,30,40];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${ex.length} mock exam scores">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="grid-l"/><text x="${L-6}" y="${y(t)+3.5}" class="ax" text-anchor="end">${t}</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${y(PASS)}" y2="${y(PASS)}" class="pass-l"/><text x="${W-R}" y="${y(PASS)-5}" class="ax pass-t" text-anchor="end">Pass 32</text>
    <path d="${area}" class="area"/>
    <polyline points="${pts.join(" ")}" class="line"/>
    ${ex.map((e,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(e.score).toFixed(1)}" r="${i===ex.length-1?4.5:3}" class="${e.score>=PASS?"pt-ok":"pt-no"}"/>`).join("")}
    <text x="${x(ex.length-1).toFixed(1)}" y="${(y(ex[ex.length-1].score)-9).toFixed(1)}" class="ax end-v" text-anchor="${ex.length>1?"end":"middle"}">${ex[ex.length-1].score}</text>
    <text x="${L}" y="${H-6}" class="ax">Older</text><text x="${W-R}" y="${H-6}" class="ax" text-anchor="end">Latest</text>
  </svg></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-go]"); if (!b || b.disabled) return;
  if (b.dataset.go) return go(b.dataset.go);
  const a = b.dataset.act, i = +b.dataset.i;
  switch (a) {
    case "go": return go(b.dataset.view);
    case "practice": return startPractice(b.dataset.topic);
    case "daily": dailyQ.pick = i; record(dailyQ.q.id, dailyQ.opts[i].ok); save(); $("#daily").innerHTML = dailyHTML(); return;
    case "daily-next": { const signQs = Q.filter(q=>q.s && q.id!==dailyQ.q.id); dailyQ = prepare(signQs[Math.floor(Math.random()*signQs.length)]); $("#daily").innerHTML = dailyHTML(); return; }
    case "pr": { const it = session.items[session.i]; if (it.pick!==null) return; it.pick = i; const ok = it.opts[i].ok; if (ok) session.right++; record(it.q.id, ok); save(); return renderPractice(); }
    case "pr-next": session.i++; if (session.i >= session.items.length) return practiceSummary(); return renderPractice();
    case "exam-start": stopTick(); session = null; return examIntro();
    case "exam-go": return startExam();
    case "ex": session.items[session.i].pick = i; session.confirm = false; return renderExam();
    case "ex-next": session.i = Math.min(EXAM_N-1, session.i+1); session.confirm=false; return renderExam();
    case "ex-prev": session.i = Math.max(0, session.i-1); session.confirm=false; return renderExam();
    case "ex-jump": session.i = i; session.confirm=false; return renderExam();
    case "ex-submit": { const left = session.items.filter(x=>x.pick===null).length; if (left) { session.confirm = "submit"; return renderExam(); } return finishExam(false); }
    case "ex-submit-yes": return finishExam(false);
    case "exam-quit": session.confirm = "quit"; renderExam(); main().scrollTop = 0; return;
    case "exam-quit-yes": session = null; return go("home");
    case "confirm-no": session.confirm = false; return renderExam();
    case "card-flip": deck.flip = true; return viewSigns();
    case "card-got": return cardNext(true);
    case "card-again": return cardNext(false);
    case "reset": $("#resetZone").innerHTML = `<p>Erase all scores, exam history, and flashcard progress on this device?</p><div class="actions"><button class="btn danger" data-act="reset-yes">Erase progress</button><button class="btn" data-act="reset-no">Cancel</button></div>`; return;
    case "reset-yes": st = blank(); save(); deck = null; dailyQ = null; return go("progress");
    case "reset-no": return viewProgress();
  }
});
document.addEventListener("change", e => { if (e.target.id === "timerToggle") { st.settings.timer = e.target.checked; save(); examIntro(); } });
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  const k = e.key.toUpperCase(), idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "ABCD".indexOf(k);
  if (idx >= 0) { const btn = document.querySelectorAll(".qcard .ans")[idx]; if (btn && !btn.disabled) { btn.click(); e.preventDefault(); } }
  else if (e.key === "ArrowRight" && session?.mode==="exam") { document.querySelector('[data-act="ex-next"]')?.click(); }
  else if (e.key === "ArrowLeft" && session?.mode==="exam") { document.querySelector('[data-act="ex-prev"]')?.click(); }
});

go("home");

if ('serviceWorker' in navigator) { addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>

</body>
</html>
